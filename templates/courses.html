<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">
<!DOCTYPE html>
<html>
<head>
    <title>Courses</title>
</head>
<body>

<h1>Courses</h1>

<form action="/add_course" method="POST">

    <input type="text"
           name="course_code"
           placeholder="Course Code"
           required>

    <input type="text"
           name="course_name"
           placeholder="Course Name"
           required>

    <select name="teacher_id">

        {% for t in teachers %}

        <option value="{{ t[0] }}">
            {{ t[1] }}
        </option>

        {% endfor %}

    </select>

    <button type="submit">
        Add Course
    </button>

</form>

<h2>Course Records</h2>

{% if courses %}

<table border="1">

<tr>
    <th>ID</th>
    <th>Code</th>
    <th>Name</th>
    <th>Teacher ID</th>
</tr>

{% for c in courses %}

<tr>
    <td>{{ c[0] }}</td>
    <td>{{ c[1] }}</td>
    <td>{{ c[2] }}</td>
    <td>{{ c[3] }}</td>
</tr>

{% endfor %}

</table>

{% else %}

<p>No courses found.</p>

{% endif %}

</body>
</html>
